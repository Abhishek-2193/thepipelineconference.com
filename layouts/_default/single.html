<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>{{ .Title }} | {{ .Site.Title }}</title>
    <meta name="date" content="{{ .Date.Format "2006-02-01" }}" scheme="YYYY-MM-DD" />
    {{ partial "stylesheets" . }}
</head>

<body>
    {{ partial "masthead.html" . }}
    {{ partial "hero.html" . }}
    <div class="container article-meta">
        {{ if .Date }}<p class="subtitle-date">{{ .Date.Format "Monday, Jan 2, 2006" }}{{ with .Params.author }} &middot; {{ . }}{{ end }}</p>{{ end }}
    </div>
    {{ partial "content.html" . }}
    <div class="edit-suggestion">Suggest edits to this page on <a
            href="https://github.com/pipedev-org/thepipelineconference.com">GitHub</a></div>
    {{ partial "footer.html" . }}
</body>

</html>
