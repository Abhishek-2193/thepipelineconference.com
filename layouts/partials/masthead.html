{{/* Site header: logo + primary navigation. Rendered on every page. */}}
<header class="site-header">
    <div class="site-header-inner">
        <a class="site-branding" href="/">
            {{ $logo := resources.Get "images/logo.png" }}
            <img class="site-logo" src="{{ $logo.RelPermalink }}" alt="{{ .Site.Title }}" />
            <span class="site-title-wrap">
                <span class="site-title">{{ .Site.Title }}</span>
                <span class="site-description">to promote, elevate and evolve VFX/CG pipelines</span>
            </span>
        </a>
        <button type="button" class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>
        {{ partial "navbar.html" . }}
    </div>
    <script>
        (function () {
            var header = document.querySelector('.site-header');
            var btn = document.querySelector('.nav-toggle');
            var nav = document.querySelector('.navbar');
            if (btn && nav) {
                btn.addEventListener('click', function () {
                    var open = nav.classList.toggle('is-open');
                    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
                });
            }
            document.querySelectorAll('.navbar-dropdown-toggle').forEach(function (toggle) {
                toggle.addEventListener('click', function () {
                    var menu = toggle.parentElement.querySelector('.navbar-dropdown-menu');
                    if (!menu) return;
                    var open = menu.classList.toggle('is-open');
                    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
                });
            });
            if (header) {
                var onScroll = function () {
                    header.classList.toggle('is-scrolled', window.scrollY > 40);
                };
                onScroll();
                window.addEventListener('scroll', onScroll, { passive: true });
            }
        })();
    </script>
</header>
